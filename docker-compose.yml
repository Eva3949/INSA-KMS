version: '3.8'

services:
  kms-postgres:
    image: postgres:15-alpine
    container_name: kms-postgres
    environment:
      POSTGRES_DB: kmsdb
      POSTGRES_USER: kmsuser
      POSTGRES_PASSWORD: kmspassword
    ports:
      - "5432:5432"
    volumes:
      - kms_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kmsuser -d kmsdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  kms-keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: kms-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://kms-postgres:5432/kmsdb
      KC_DB_USERNAME: kmsuser
      KC_DB_PASSWORD: kmspassword
      KC_HTTP_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      kms-postgres:
        condition: service_healthy

volumes:
  kms_postgres_data:

