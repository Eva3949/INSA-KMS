version: '3.8'

services:
  kms-postgres:
    image: postgres:15-alpine
    container_name: kms-postgres
    environment:
      POSTGRES_DB: kmsdb
      POSTGRES_USER: kmsuser
      POSTGRES_PASSWORD: kmspassword
    ports:
      - "5432:5432"
    volumes:
      - kms-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kmsuser -d kmsdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  kms-keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: kms-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: ${KC_DB_URL:-jdbc:postgresql://${DATABASE_HOST:-kms-postgres}:${DATABASE_PORT:-5432}/${DATABASE_NAME:-kmsdb}${DATABASE_SSLMODE:-}}
      KC_DB_USERNAME: ${DATABASE_USERNAME:-kmsuser}
      KC_DB_PASSWORD: ${DATABASE_PASSWORD:-kmspassword}
    ports:
      - "8080:8080"

  kms-backend-1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kms-backend-1
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://${DATABASE_HOST:-kms-postgres}:${DATABASE_PORT:-5432}/${DATABASE_NAME:-kmsdb}${DATABASE_SSLMODE:-}}
      SPRING_DATASOURCE_USERNAME: ${DATABASE_USERNAME:-kmsuser}
      SPRING_DATASOURCE_PASSWORD: ${DATABASE_PASSWORD:-kmspassword}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${KEYCLOAK_URL:-http://localhost:8080}/realms/kms-realm
    depends_on:
      kms-keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

  kms-backend-2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kms-backend-2
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://${DATABASE_HOST:-kms-postgres}:${DATABASE_PORT:-5432}/${DATABASE_NAME:-kmsdb}${DATABASE_SSLMODE:-}}
      SPRING_DATASOURCE_USERNAME: ${DATABASE_USERNAME:-kmsuser}
      SPRING_DATASOURCE_PASSWORD: ${DATABASE_PASSWORD:-kmspassword}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${KEYCLOAK_URL:-http://localhost:8080}/realms/kms-realm
    depends_on:
      kms-keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

  kms-load-balancer:
    image: nginx:alpine
    container_name: kms-load-balancer
    ports:
      - "8081:80"
    volumes:
      - ./nginx/nginx-ha.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - kms-backend-1
      - kms-backend-2

volumes:
  kms-postgres-data:
