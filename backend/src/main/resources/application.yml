server:
  port: 8081

spring:
  application:
    name: kms-backend

  servlet:
    multipart:
      enabled: true
      max-file-size: 500MB
      max-request-size: 500MB

  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://${DATABASE_HOST:${DB_HOST:dpg-da43olv40ujc73cpl09g-a.virginia-postgres.render.com}}:${DATABASE_PORT:${DB_PORT:5432}}/${DATABASE_NAME:${DB_NAME:insakms}}${DATABASE_SSLMODE:${DB_SSLMODE:?sslmode=require}}}}
    username: ${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:${DB_USER:insakms_user}}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:${DB_PASS:hLYoKjsf0GlpZbKCNfSDZ8aRGoR0oMYS}}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Section 7 email integration - disabled until SMTP is configured (KMS_SMTP_HOST empty).
  mail:
    host: ${KMS_SMTP_HOST:}
    port: ${KMS_SMTP_PORT:587}
    username: ${KMS_SMTP_USERNAME:}
    password: ${KMS_SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: ${KMS_SMTP_STARTTLS:true}

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    # V4/V5 were applied to the Render database from files that are not in this
    # repository. Tolerate applied-but-missing migrations so startup is not blocked;
    # remove this once those two scripts are restored into db/migration.
    ignore-migration-patterns: "*:missing"

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/kms-realm

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

kms:
  storage:
    # Physical document binaries live here (relative paths resolve against the process
    # working directory). Mount this to a durable volume in container deployments —
    # a container filesystem is wiped on redeploy while the metadata rows survive.
    location: ${KMS_STORAGE_LOCATION:kms-storage-data}
