<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Background -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4" />

  <!-- Outer Cyber Shield -->
  <path d="M 256,64 L 384,112 C 384,260 296,356 256,384 C 216,356 128,260 128,112 Z" 
        fill="url(#shieldGrad)" 
        stroke="#7dd3fc" 
        stroke-width="6" 
        filter="url(#glow)" 
        opacity="0.95" />

  <!-- Inner Shield Border -->
  <path d="M 256,88 L 360,126 C 360,244 290,324 256,348 C 222,324 152,244 152,126 Z" 
        fill="#0f172a" 
        stroke="url(#accentGrad)" 
        stroke-width="3" 
        opacity="0.85" />

  <!-- Knowledge Data Network Nodes -->
  <g stroke="#38bdf8" stroke-width="3" fill="#38bdf8">
    <line x1="256" y1="160" x2="210" y2="195" />
    <line x1="256" y1="160" x2="302" y2="195" />
    <line x1="210" y1="195" x2="185" y2="230" />
    <line x1="302" y1="195" x2="327" y2="230" />
    <line x1="256" y1="160" x2="256" y2="220" />

    <circle cx="256" cy="160" r="8" fill="#facc15" stroke="#fff" stroke-width="2" />
    <circle cx="210" cy="195" r="6" fill="#38bdf8" />
    <circle cx="302" cy="195" r="6" fill="#38bdf8" />
    <circle cx="185" cy="230" r="5" fill="#67e8f9" />
    <circle cx="327" cy="230" r="5" fill="#67e8f9" />
    <circle cx="256" cy="220" r="6" fill="#facc15" />
  </g>

  <!-- Open Knowledge Book -->
  <g fill="#ffffff" filter="url(#glow)">
    <!-- Left Book Page -->
    <path d="M 250,240 C 215,225 175,230 160,235 L 160,305 C 175,300 215,295 250,310 Z" fill="#f8fafc" />
    <!-- Right Book Page -->
    <path d="M 262,240 C 297,225 337,230 352,235 L 352,305 C 337,300 297,295 262,310 Z" fill="#f8fafc" />
    <!-- Book Spine -->
    <path d="M 250,240 L 262,240 L 262,312 L 250,312 Z" fill="#94a3b8" />
    <!-- Page Circuit Accent Lines -->
    <path d="M 180,255 L 230,250 M 180,270 L 230,265 M 180,285 L 220,280" stroke="#0284c7" stroke-width="2" stroke-linecap="round" />
    <path d="M 332,255 L 282,250 M 332,270 L 282,265 M 332,285 L 292,280" stroke="#0284c7" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Typography: INSA KMS -->
  <text x="256" y="435" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="4">INSA</text>
  <text x="256" y="475" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#38bdf8" letter-spacing="8">KMS</text>
</svg>
